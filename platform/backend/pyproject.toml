[project]
name = "genomic-platform-backend"
version = "0.1.0"
description = "Genomic Analysis & Variant Interpretation Platform - application backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "aioboto3>=13.0",
  "httpx>=0.27",
  "duckdb>=1.0",
  "pyarrow>=17.0",
  "python-json-logger>=2.0",
  # Password hashing. Declared explicitly: the application refuses to start
  # without a real hasher rather than falling back to a weaker one.
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
# Import test support packages as ``tests.support.*``.
pythonpath = [".", ".."]
asyncio_mode = "auto"
markers = [
  "integration: requires live PostgreSQL/Redis/object storage",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

# aioboto3/botocore ship no type information. The ignore is scoped to those
# imports only; our own object-storage boundary stays fully typed.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*"]
ignore_missing_imports = true
